name: Test launch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify launch on ubuntu-24.04
    runs-on: ubuntu-24.04
    env:
      REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check python3 dependency
        run: python3 --version

      - name: Compile launch package
        run: python3 -m compileall script/launch

      - name: Verify install-codegraph.sh shell syntax
        run: bash -n ./script/install-codegraph.sh

      - name: Verify install-codegraph.sh layered success path
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: ✓ Connected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          cat >"$fixture/home/.claude.json" <<'EOF'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          EOF

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q '\[PASS\] CodeGraph 已就绪，跳过'
          printf '%s\n' "$output" | grep -q 'CodeGraph install 通过: codegraph v0.9.9'
          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph offline_verify 通过: claude mcp get codegraph 显示已连接:  ✓ Connected'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall 通过: CLI、配置与离线发现均通过'

      - name: Verify install-codegraph.sh repairs missing Claude config
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          if [[ "${1:-}" == "install" && "${2:-}" == "-t" && "${3:-}" == "claude" ]]; then
            cat >"$HOME/.claude.json" <<'OUT'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          OUT
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: ✓ Connected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall 通过: CLI、配置与离线发现均通过'

      - name: Verify install-codegraph.sh offline failure is soft
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: Disconnected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          cat >"$fixture/home/.claude.json" <<'EOF'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          EOF

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q 'CodeGraph install 通过: codegraph v0.9.9'
          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph offline_verify 失败: claude 已发现 codegraph，但未连接'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall: CLI 与配置已通过，但离线发现失败'

      - name: Verify launch manifest regression script
        run: bash ./tests/test-launch-manifest.sh

      - name: Verify launch plan regression script
        run: bash ./tests/test-launch-plan.sh

      - name: Verify launch settings merge regression script
        run: bash ./tests/test-launch-settings.sh

      - name: Verify launch doctor regression script
        run: bash ./tests/test-launch-doctor.sh

      - name: Verify launch context smoke regression script
        run: bash ./tests/test-launch-context-smoke.sh

      - name: Verify launch tui regression script
        run: bash ./tests/test-launch-tui.sh

      - name: Run launch smoke test
        run: ./launch install --ci --smoke-test
        env:
          REPO_ROOT: ${{ github.workspace }}
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASEURL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_APIKEY }}
          CLAUDE_MODEL: deepseek-v4-flash
          # CI 冷环境（首次 claude 启动 + 代理握手）需要比本机更长的超时
          CLAUDE_CONTEXT_TIMEOUT: 60
          CLAUDE_DOCTOR_TIMEOUT: 30

      - name: Verify idempotency with second run
        run: |
          set -euo pipefail

          attempt=1
          while true; do
            echo "=== 第 ${attempt} 次幂等性检查 ==="
            set +e
            output=$(./launch install --ci --force --smoke-test 2>&1)
            rc=$?
            set -e
            echo "$output"
            if printf '%s\n' "$output" | grep -q 'CLAUDE_HOME 未初始化，已后台启动 Claude Code' && [[ "$attempt" -lt 3 ]]; then
              echo "检测到 Claude 首次初始化，等待后重试..."
              sleep 5
              attempt=$((attempt + 1))
              continue
            fi

            if [[ "$rc" -ne 0 ]]; then
              echo "FAIL: launch --ci exited with $rc"
              exit "$rc"
            fi

            required_checks=(
              "doctor 检查全部通过"
              "settings.json 已合并并补齐缺失项"
              "plugin 'claude-code-setup@claude-plugins-official' 已注册"
              "plugin 'context-mode@context-mode' 已注册"
            )
            missing_checks=0
            for check in "${required_checks[@]}"; do
              if ! printf '%s\n' "$output" | grep -Fq -- "$check"; then
                echo "FAIL: 第二次运行缺少验证证据: $check"
                missing_checks=1
              fi
            done
            if [[ "$missing_checks" -eq 0 ]]; then
              break
            fi

            echo "FAIL: 第二次运行未完成逐项安装后验证"
            exit 1
          done
        env:
          REPO_ROOT: ${{ github.workspace }}
          CTX_INSTALL_MODE: copy
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASEURL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_APIKEY }}
          CLAUDE_MODEL: deepseek-v4-flash
          CLAUDE_CONTEXT_TIMEOUT: 60
          CLAUDE_DOCTOR_TIMEOUT: 30
