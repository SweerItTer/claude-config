name: Test setup.sh

on:
  push:
    branches: [main, refactor/phase2, refactor/phase3-tui]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify setup.sh on ubuntu-24.04
    runs-on: ubuntu-24.04
    env:
      REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify install-codegraph.sh shell syntax
        run: bash -n ./script/install-codegraph.sh

      - name: Verify install-codegraph.sh layered success path
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: ✓ Connected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          cat >"$fixture/home/.claude.json" <<'EOF'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          EOF

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q '\[PASS\] CodeGraph 已就绪，跳过'
          printf '%s\n' "$output" | grep -q 'CodeGraph install 通过: codegraph v0.9.9'
          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph offline_verify 通过: claude mcp get codegraph 显示已连接:  ✓ Connected'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall 通过: CLI、配置与离线发现均通过'

      - name: Verify install-codegraph.sh repairs missing Claude config
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          if [[ "${1:-}" == "install" && "${2:-}" == "-t" && "${3:-}" == "claude" ]]; then
            cat >"$HOME/.claude.json" <<'OUT'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          OUT
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: ✓ Connected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall 通过: CLI、配置与离线发现均通过'

      - name: Verify install-codegraph.sh offline failure is soft
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/bin" "$fixture/home"

          cat >"$fixture/bin/codegraph" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codegraph v0.9.9"
            exit 0
          fi

          echo "unexpected codegraph args: $*" >&2
          exit 1
          EOF

          cat >"$fixture/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "mcp" && "${2:-}" == "get" && "${3:-}" == "codegraph" ]]; then
            cat <<'OUT'
          Scope: User config
          Status: Disconnected
          Type: stdio
          Command: codegraph
          Args: serve --mcp
          OUT
            exit 0
          fi

          echo "unexpected claude args: $*" >&2
          exit 1
          EOF

          chmod +x "$fixture/bin/codegraph" "$fixture/bin/claude"

          cat >"$fixture/home/.claude.json" <<'EOF'
          {
            "mcpServers": {
              "codegraph": {
                "type": "stdio",
                "command": "codegraph",
                "args": ["serve", "--mcp"]
              }
            }
          }
          EOF

          output=$(HOME="$fixture/home" PATH="$fixture/bin:$PATH" bash ./script/install-codegraph.sh "$REPO_ROOT" false false false 2>&1)
          echo "$output"

          printf '%s\n' "$output" | grep -q 'CodeGraph install 通过: codegraph v0.9.9'
          printf '%s\n' "$output" | grep -q 'CodeGraph configure 通过: .*/.claude.json 已包含期望的 mcpServers.codegraph 配置'
          printf '%s\n' "$output" | grep -q 'CodeGraph offline_verify 失败: claude 已发现 codegraph，但未连接'
          printf '%s\n' "$output" | grep -q 'CodeGraph overall: CLI 与配置已通过，但离线发现失败'

      - name: Build and test installer-tui with FTXUI 7.0.2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y screen
          ftxui_src="$RUNNER_TEMP/ftxui"
          ftxui_prefix="$RUNNER_TEMP/ftxui-prefix"
          git clone --branch v7.0.2 --depth 1 https://github.com/ArthurSonzogni/FTXUI.git "$ftxui_src"
          cmake -S "$ftxui_src" -B "$ftxui_src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$ftxui_src/build" --parallel
          cmake --install "$ftxui_src/build" --prefix "$ftxui_prefix"
          cmake -S ./tools/installer-tui -B ./build/installer-tui \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ftxui_prefix"
          cmake --build ./build/installer-tui --parallel
          chmod +x ./script/test-installer-tui.sh
          ./script/test-installer-tui.sh

      - name: Verify setup dependency bootstrap regression script
        run: |
          chmod +x ./script/test-setup-dependencies.sh
          ./script/test-setup-dependencies.sh

      - name: Verify settings merge regression script
        run: |
          chmod +x ./script/test-settings-merge.sh
          ./script/test-settings-merge.sh

      - name: Run setup.sh smoke test
        run: |
          chmod +x ./setup.sh
          ./setup.sh --ci --smoke-test
        env:
          REPO_ROOT: ${{ github.workspace }}
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASEURL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_APIKEY }}
          CLAUDE_MODEL: deepseek-v4-flash
          # CI 冷环境（首次 claude 启动 + 代理握手）需要比本机更长的超时
          CLAUDE_CONTEXT_TIMEOUT: 60
          CLAUDE_DOCTOR_TIMEOUT: 30

      - name: Verify idempotency with second run
        run: |
          set -euo pipefail

          attempt=1
          while true; do
            echo "=== 第 ${attempt} 次幂等性检查 ==="
            set +e
            output=$(./setup.sh --ci --force --smoke-test 2>&1)
            rc=$?
            set -e
            echo "$output"
            if printf '%s\n' "$output" | grep -q 'CLAUDE_HOME 未初始化，已后台启动 Claude Code' && [[ "$attempt" -lt 3 ]]; then
              echo "检测到 Claude 首次初始化，等待后重试..."
              sleep 5
              attempt=$((attempt + 1))
              continue
            fi

            if [[ "$rc" -ne 0 ]]; then
              echo "FAIL: setup.sh --ci exited with $rc"
              exit "$rc"
            fi

            required_checks=(
              "安装后冒烟测试通过: Claude doctor + skills/context + settings + plugins"
              "settings.json 已补齐模板键并保留用户值"
              "plugin 'claude-code-setup@claude-plugins-official' 已注册 (scope=user)"
              "skill 'context-mode' 已安装且在 Claude /context 中可见"
            )
            missing_checks=0
            for check in "${required_checks[@]}"; do
              if ! printf '%s\n' "$output" | grep -Fq -- "$check"; then
                echo "FAIL: 第二次运行缺少验证证据: $check"
                missing_checks=1
              fi
            done
            if [[ "$missing_checks" -eq 0 ]]; then
              break
            fi

            echo "FAIL: 第二次运行未完成逐项安装后验证"
            exit 1
          done
        env:
          REPO_ROOT: ${{ github.workspace }}
          CTX_INSTALL_MODE: copy
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASEURL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_APIKEY }}
          CLAUDE_MODEL: deepseek-v4-flash
          CLAUDE_CONTEXT_TIMEOUT: 60
          CLAUDE_DOCTOR_TIMEOUT: 30
