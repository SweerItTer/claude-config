name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run regression tests
        run: |
          set -euo pipefail
          bash -n setup.sh
          bash tests/test-manifest-parsing.sh
          bash tests/test-resource-plan.sh
          bash tests/test-setup-resolver.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            prerelease_args=(--prerelease)
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease_args=()
          else
            echo "不支持的版本 tag: $tag" >&2
            exit 1
          fi

          gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "$tag" \
            "${prerelease_args[@]}"
